<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Property photo contact sheet</title>
<style>
  body { margin: 0; background: #fff; font: 12px/1.3 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  figure { margin: 0; }
  img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; display: block; }
  figcaption { margin-top: 4px; color: #444; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  for (let i = 1; i <= 20; i += 1) {
    const figure = document.createElement('figure');
    const img = document.createElement('img');
    img.src = `../../../public/images/Ely%20Homes%20Photography%20(${i}%20of%2020).jpg`;
    img.alt = `Photo ${i}`;
    const caption = document.createElement('figcaption');
    caption.textContent = `${i} of 20`;
    figure.append(img, caption);
    grid.append(figure);
  }
</script>
</body>
</html>
