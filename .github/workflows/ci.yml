name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  server:
    name: Server (typecheck + prisma + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Lets Prisma's postinstall + generate resolve the sqlite datasource url
      # without a .env file. Tests never open a real database.
      #
      # NODE_ENV is "production" (not "test") because the suite is written to
      # exercise the production code paths: publicUrl tests assert the
      # production host derivation, and env validation in production rejects
      # the dev placeholder secrets - so real-looking values are supplied here.
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: "production"
      JWT_ACCESS_SECRET: "ci-access-secret-0123456789abcdefghijklmnopqrst"
      JWT_REFRESH_SECRET: "ci-refresh-secret-0123456789abcdefghijklmnopqr"
      CLIENT_URL: "http://localhost:5173"
      CORS_ORIGIN: "http://localhost:5173"
      WITHHOLDING_TAX_RATE: "5"
      CLOUDINARY_URL: "cloudinary://999999999999999:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef@ci-cloud"
      # A fixture, not a credential: no request leaves the runner, so the value
      # only has to satisfy validation. It must not look like a sandbox key -
      # env validation refuses sk_test_ under NODE_ENV=production, because a test
      # key in production would confirm bookings and release host payouts against
      # money that never moved. That refusal was rejecting this whole env, so
      # every suite died at import and the server job never ran an assertion.
      PAYSTACK_SECRET_KEY: "sk_live_ci_fixture_not_a_real_key"
      # No VAPID key material is stored here. web-push throws at import on a
      # malformed key, so a placeholder string took down every suite that touches
      # push. The pair is generated per run in the test step below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        # --include=dev because NODE_ENV is production for this job (see above),
        # and npm omits devDependencies under it - which left tsx missing, so
        # every test file failed to import before running a single assertion.
        run: npm ci --include=dev
      - name: Generate Prisma client (sqlite schema)
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Validate schemas
        run: |
          npx prisma validate --schema=prisma/schema.prisma
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/zurilofts?schema=public" \
            npx prisma validate --schema=prisma/schema.postgresql.prisma
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: |
          # Generated per run, so no key material lives in the repository and the
          # pair is always a shape web-push accepts.
          eval "$(node -e "const w = require('web-push'); const k = w.generateVAPIDKeys(); console.log('export VAPID_PUBLIC_KEY=' + k.publicKey); console.log('export VAPID_PRIVATE_KEY=' + k.privateKey);")"
          node --import tsx --test tests/*.test.ts
